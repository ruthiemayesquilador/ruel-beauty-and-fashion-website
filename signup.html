<!DOCTYPE html>
<html lang="en">
<ame="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover the latest trends for a confident, glamorous you.">
    <meta name="author" content="Ruthiemay Esquilador">
    <title>Ruel | Beauty & Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header -->
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">Ruel
                    <br>
                <p>Beauty & Fashion</p></h2>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="offers.html">OFFERS</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                    <li><a href="signup.html">SIGN UP</a></li>
                </ul>
            </div>

            <div class="search">
                <input class="srch" type="search" name="" placeholder="Type to Search">
                <a href="#"> <button class="btn">Search</button></a>
            </div>
        </div> 

      <div class="form-container">
        <form id="signup-form" action="/signup" method="POST" onsubmit="return validateForm();">
          <h2>Sign Up</h2>
          <div class="input-group">
            <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
          </div>
          <div class="input-group">
            <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
          </div>
          <div class="input-group">
            <input type="text" id="phone_number" name="phone_number" placeholder="Phone Number" required>
          </div>
          <div class="input-group">
            <input type="text" id="email" name="email" placeholder="Email" required>
          </div>
          <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Password" required>
          </div>
          <div class="input-group">
            <input type="submit" value="Create account">
          </div>
          <div class="toggle-form">
            Already have an account? <a id="toggle-link" onclick="toggleForm()">Log in</a>
          </div>
          <div id="error-container" class="error-message"></div>
        </form>
        
        <form id="login-form" action="/login" method="POST" style="display: none;">
          <h2>Login</h2>
          <div class="input-group">
            <input type="text" id="login_email" name="login_email" placeholder="Email" required>
          </div>
          <div class="input-group">
            <input type="password" id="login_password" name="login_password" placeholder="Password" required>
          </div>
          <div class="input-group">
            <input type="submit" value="Login">
          </div>
          <div class="toggle-form">
            Don't have an account? <a id="toggle-link" onclick="toggleForm()">Sign up</a>
          </div>
        </form>
      </div>


<!-- Footer --> 
<div>
<p class = "footer">©️ 2023 Ruel Beauty & Fashion | All rights reserved.</p>
</div>

<script src="script.js"></script>
</body> 
</html>
